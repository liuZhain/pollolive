<!DOCTYPE html>
<html>
<head>
  <title>Pollive - Room</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <div class="room-header">
      <h1>📊 Pollive</h1>
      <h2>🟢 Room: <span id="roomDisplay"></span></h2>
    </div>

    <div id="notificationArea"></div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel" style="display:none;">
      <h3>⚙️ Admin Panel</h3>
      
      <div style="margin:10px 0; padding:10px; background:rgba(255,255,255,0.05); border-radius:12px;">
        <label style="display:inline-block; margin-right:15px; font-weight:bold; color:rgba(255,255,255,0.8);">
          🎨 Warna Tema:
          <input type="color" id="themeColor" value="#7c3aed" 
                 style="width:60px; height:45px; border:none; cursor:pointer; border-radius:8px; vertical-align:middle; margin-left:10px; background:transparent;">
        </label>
        <button onclick="changeTheme()" style="width:auto; padding:8px 20px; background:#7c3aed; color:white; border:none; border-radius:10px; cursor:pointer;">Ganti Tema</button>
        <button onclick="resetTheme()" style="width:auto; padding:8px 20px; background:rgba(255,255,255,0.1); color:white; border:none; border-radius:10px; cursor:pointer;">Reset</button>
      </div>

      <div id="optionsEditor">
        <div id="optionInputs">
          <input type="text" class="opt-input" placeholder="Opsi 1" value="Opsi A">
          <input type="text" class="opt-input" placeholder="Opsi 2" value="Opsi B">
          <input type="text" class="opt-input" placeholder="Opsi 3" value="Opsi C">
          <input type="text" class="opt-input" placeholder="Opsi 4" value="Opsi D">
        </div>
        
        <div style="margin:10px 0;">
          <label style="display:inline-block; margin-right:10px; color:rgba(255,255,255,0.8);">
            Maksimal pilihan per orang:
            <select id="maxVotesSelect" style="padding:8px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:white;">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>
        
        <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
          <button onclick="addOption()" style="width:auto; padding:8px 18px; background:#3b82f6;">+ Tambah Opsi</button>
          <button onclick="saveOptions()" style="width:auto; padding:8px 18px; background:#22c55e;">Simpan Opsi</button>
          <button onclick="togglePolling()" id="togglePollBtn" style="width:auto; padding:8px 18px; background:#f59e0b;">Mulai Polling</button>
          <button onclick="resetPoll()" style="width:auto; padding:8px 18px; background:#ef4444;">Reset Suara</button>
        </div>
      </div>
    </div>

    <!-- INFO PESERTA -->
    <div class="participant-info">
      <div>
        <p>👥 Total Peserta: <span id="userCount">0</span></p>
        <p id="votedStatus" style="color:rgba(255,255,255,0.6);"></p>
      </div>
      <div>
        <p id="votedCount" style="font-size:14px; color:rgba(255,255,255,0.5);">✅ Sudah vote: 0 orang</p>
      </div>
    </div>

    <!-- AREA POLLING -->
    <div id="pollArea" style="display:none;">
      <h2>📝 Pilih Opsi:</h2>
      <p style="color:rgba(255,255,255,0.5); font-size:14px;" id="maxVotesInfo"></p>
      <div id="options"></div>
      <div id="result">
        <h3>📊 Hasil Sementara:</h3>
        <div id="voteResult">
          <div id="chart"></div>
          <div id="stats"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <p>Made with ❤️ by Pollive</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roomCode = params.get('room');
    const username = params.get('user');
    const isAdminParam = params.get('admin') === 'true';
    const roomPassword = params.get('password') || '';

    document.getElementById('roomDisplay').textContent = roomCode;

    const socket = io();
    let currentOptions = ['A', 'B', 'C', 'D'];
    let currentLabels = ['Opsi A', 'Opsi B', 'Opsi C', 'Opsi D'];
    let isPollActive = false;
    let maxVotes = 1;
    let userVotes = [];
    let hasVoted = false;
    let isAdmin = false;
    let votedUsers = [];

    socket.emit('join-room', { roomCode, username, isAdmin: isAdminParam, password: roomPassword });

    socket.on('error', (msg) => {
      showNotification(msg, 'error');
    });

    socket.on('warning', (msg) => {
      showNotification(msg, 'warning');
    });

    socket.on('notification', (data) => {
      showNotification(data.message, data.type);
    });

    socket.on('room-update', (data) => {
      document.getElementById('userCount').textContent = data.users.length;
      currentOptions = data.options || ['A', 'B', 'C', 'D'];
      currentLabels = data.optionLabels || ['Opsi A', 'Opsi B', 'Opsi C', 'Opsi D'];
      isPollActive = data.isActive || false;
      maxVotes = data.maxVotes || 1;
      hasVoted = data.hasVoted || false;
      isAdmin = data.isAdmin || false;

      const isUserAdmin = data.users.find(u => u.id === socket.id)?.isAdmin || false;
      
      const adminPanel = document.getElementById('adminPanel');
      if (isUserAdmin) {
        adminPanel.style.display = 'block';
      } else {
        adminPanel.style.display = 'none';
      }

      document.getElementById('maxVotesInfo').textContent = `Pilih maksimal ${maxVotes} opsi`;

      if (hasVoted) {
        document.getElementById('votedStatus').textContent = '✅ Anda sudah vote!';
        document.getElementById('votedStatus').style.color = '#4ade80';
      } else {
        document.getElementById('votedStatus').textContent = '⏳ Belum vote';
        document.getElementById('votedStatus').style.color = '#fbbf24';
      }

      if (isPollActive) {
        document.getElementById('pollArea').style.display = 'block';
        document.getElementById('togglePollBtn').textContent = 'Hentikan Polling';
        document.getElementById('togglePollBtn').style.background = '#ef4444';
        renderOptions();
      } else {
        document.getElementById('pollArea').style.display = 'none';
        document.getElementById('togglePollBtn').textContent = 'Mulai Polling';
        document.getElementById('togglePollBtn').style.background = '#f59e0b';
      }

      if (data.votes && Object.keys(data.votes).length > 0) {
        renderChart(data.votes);
      }

      if (isUserAdmin) {
        const inputs = document.querySelectorAll('.opt-input');
        inputs.forEach((input, i) => {
          if (i < currentLabels.length) {
            input.value = currentLabels[i];
          }
        });
        document.getElementById('maxVotesSelect').value = maxVotes;
      }
    });

    socket.on('vote-update', (votes) => {
      renderChart(votes);
    });

    socket.on('voted-users', (votedIds) => {
      votedUsers = votedIds || [];
      document.getElementById('votedCount').textContent = `✅ Sudah vote: ${votedUsers.length} orang`;
    });

    function showNotification(message, type = 'info') {
      const area = document.getElementById('notificationArea');
      const notif = document.createElement('div');
      
      let bgColor = 'rgba(30,30,60,0.9)';
      if (type === 'error') bgColor = 'rgba(239,68,68,0.9)';
      else if (type === 'warning') bgColor = 'rgba(245,158,11,0.9)';
      else if (type === 'success') bgColor = 'rgba(34,197,94,0.9)';
      else if (type === 'vote') bgColor = 'rgba(124,58,237,0.9)';
      
      notif.style.cssText = `
        background: ${bgColor}; color: white; padding: 12px 20px;
        border-radius: 12px; margin: 5px 0;
        font-weight: 600; font-size: 14px;
        animation: slideDown 0.3s ease;
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.1);
      `;
      notif.textContent = message;
      area.appendChild(notif);
      
      setTimeout(() => {
        notif.style.opacity = '0';
        notif.style.transition = 'opacity 0.5s';
        setTimeout(() => notif.remove(), 500);
      }, 3000);
    }

    function renderOptions() {
      const container = document.getElementById('options');
      container.innerHTML = '';
      userVotes = [];

      currentOptions.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'vote-btn';
        btn.textContent = currentLabels[i] || opt;
        btn.dataset.option = opt;
        btn.onclick = () => {
          if (hasVoted) {
            showNotification('⛔ Anda sudah vote!', 'error');
            return;
          }
          if (!isPollActive) {
            showNotification('⛔ Polling belum dimulai!', 'error');
            return;
          }
          toggleVote(btn, opt);
        };
        container.appendChild(btn);
      });

      const submitBtn = document.createElement('button');
      submitBtn.textContent = '📨 Kirim Vote';
      submitBtn.style.cssText = `
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        color: white; border: none;
        padding: 14px 20px; border-radius: 14px; cursor: pointer;
        font-weight: bold; font-size: 16px; margin-top: 12px;
        width: 100%; transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(124,58,237,0.3);
      `;
      submitBtn.onmouseover = () => {
        submitBtn.style.transform = 'scale(1.02)';
        submitBtn.style.boxShadow = '0 8px 30px rgba(124,58,237,0.5)';
      };
      submitBtn.onmouseout = () => {
        submitBtn.style.transform = 'scale(1)';
        submitBtn.style.boxShadow = '0 4px 20px rgba(124,58,237,0.3)';
      };
      submitBtn.onclick = submitVote;
      container.appendChild(submitBtn);
    }

    function toggleVote(btn, option) {
      const index = userVotes.indexOf(option);
      if (index > -1) {
        userVotes.splice(index, 1);
        btn.style.background = 'rgba(255,255,255,0.1)';
        btn.style.transform = 'scale(1)';
        btn.style.boxShadow = 'none';
        btn.style.border = '2px solid rgba(255,255,255,0.1)';
      } else {
        if (userVotes.length >= maxVotes) {
          showNotification(`Maksimal pilih ${maxVotes} opsi!`, 'warning');
          return;
        }
        userVotes.push(option);
        btn.style.background = '#22c55e';
        btn.style.transform = 'scale(1.08)';
        btn.style.boxShadow = '0 8px 30px rgba(34,197,94,0.4)';
        btn.style.border = '2px solid #22c55e';
      }
    }

    function submitVote() {
      if (userVotes.length === 0) {
        showNotification('Pilih minimal 1 opsi!', 'warning');
        return;
      }
      if (hasVoted) {
        showNotification('Anda sudah vote!', 'error');
        return;
      }
      if (!isPollActive) {
        showNotification('Polling belum dimulai!', 'error');
        return;
      }

      socket.emit('send-vote', { roomCode, options: userVotes });

      hasVoted = true;
      document.getElementById('votedStatus').textContent = '✅ Anda sudah vote!';
      document.getElementById('votedStatus').style.color = '#4ade80';
      
      document.querySelectorAll('.vote-btn').forEach(b => {
        b.style.opacity = '0.5';
        b.style.cursor = 'not-allowed';
        b.onclick = null;
      });
      
      showNotification(`✅ Vote berhasil dikirim (${userVotes.length} pilihan)!`, 'success');
    }

    function renderChart(votes) {
      const total = Object.values(votes).reduce((a, b) => a + b, 0);
      const colors = ['#22c55e', '#3b82f6', '#f59e0b', '#a855f7', '#ef4444', '#06b6d4'];

      let chartHTML = '';
      let statsHTML = '<div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">';

      currentOptions.forEach((opt, i) => {
        const count = votes[opt] || 0;
        const percent = total > 0 ? Math.round((count / total) * 100) : 0;
        const color = colors[i % colors.length];

        chartHTML += `
          <div style="margin:8px 0;">
            <span style="display:inline-block; width:80px; font-weight:bold; color:rgba(255,255,255,0.9);">${currentLabels[i]}:</span>
            <div style="display:inline-block; width:200px; height:30px; background:rgba(255,255,255,0.05); border-radius:15px; overflow:hidden; vertical-align:middle; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);">
              <div style="width:${percent}%; height:100%; background:${color}; transition:width 0.8s cubic-bezier(0.16, 1, 0.3, 1); border-radius:15px; display:flex; align-items:center; justify-content:flex-end; padding-right:5px; color:white; font-weight:bold; font-size:12px;">
                ${percent > 10 ? percent + '%' : ''}
              </div>
            </div>
            <span style="margin-left:10px; font-size:14px; color:rgba(255,255,255,0.6);">${percent}% (${count})</span>
          </div>
        `;
      });

      statsHTML += `<div style="font-weight:bold; font-size:18px; color:#a78bfa;">📊 Total Suara: ${total}</div>`;
      statsHTML += '</div>';

      document.getElementById('chart').innerHTML = chartHTML;
      document.getElementById('stats').innerHTML = statsHTML;
    }

    function addOption() {
      const container = document.getElementById('optionInputs');
      const input = document.createElement('input');
      input.className = 'opt-input';
      input.placeholder = `Opsi ${container.children.length + 1}`;
      container.appendChild(input);
    }

    function saveOptions() {
      const inputs = document.querySelectorAll('.opt-input');
      const labels = Array.from(inputs).map(inp => inp.value.trim()).filter(v => v !== '');
      if (labels.length < 2) {
        showNotification('Minimal 2 opsi!', 'error');
        return;
      }
      const options = labels.map((_, i) => String.fromCharCode(65 + i));
      const maxVotes = parseInt(document.getElementById('maxVotesSelect').value) || 1;
      
      socket.emit('update-options', { 
        roomCode, 
        options, 
        optionLabels: labels,
        maxVotes: maxVotes
      });
    }

    function togglePolling() {
      const newState = !isPollActive;
      socket.emit('toggle-polling', { roomCode, isActive: newState });
    }

    function resetPoll() {
      if (confirm('Yakin mau reset semua suara?')) {
        socket.emit('reset-poll', { roomCode });
      }
    }

    function applyTheme(color) {
      document.querySelector('.container h1').style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
      document.querySelector('.container h1').style.webkitBackgroundClip = 'text';
      document.querySelector('.container h1').style.webkitTextFillColor = 'transparent';
      document.querySelector('.container h2').style.color = color;
      const adminPanel = document.getElementById('adminPanel');
      if (adminPanel) adminPanel.style.borderColor = color;
      document.querySelectorAll('.vote-btn').forEach(btn => {
        if (!btn.style.background || btn.style.background.includes('rgba(255,255,255,0.1)')) {
          btn.style.borderColor = color;
        }
      });
      document.getElementById('userCount').style.color = color;
    }

    function changeTheme() {
      const color = document.getElementById('themeColor').value;
      applyTheme(color);
      socket.emit('change-theme', { roomCode, color });
      showNotification('🎨 Tema berhasil diubah!', 'success');
    }

    function resetTheme() {
      const defaultColor = '#7c3aed';
      document.getElementById('themeColor').value = defaultColor;
      applyTheme(defaultColor);
      socket.emit('change-theme', { roomCode, color: defaultColor });
      showNotification('🔄 Tema direset!', 'info');
    }

    socket.on('theme-updated', ({ color }) => {
      applyTheme(color);
      if (document.getElementById('themeColor')) {
        document.getElementById('themeColor').value = color;
      }
    });
  </script>
</body>
</html>
